[defaults]
inventory = inventory.yml
remote_user = oski
host_key_checking = True
timeout = 10
forks = 10
retry_files_enabled = False
interpreter_python = auto_silent
roles_path = roles
callback_plugins = callback_plugins
callbacks_enabled = ccdc_summary,ccdc_results

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=no
