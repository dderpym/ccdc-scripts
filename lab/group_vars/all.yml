# Connection credentials for this fixture; repository defaults remain unchanged.
ansible_ssh_private_key_file: '{{ inventory_dir }}/secrets/id_ed25519'
ccdc_known_hosts_file: '{{ inventory_dir }}/secrets/known_hosts'
ansible_ssh_common_args: '-o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ ccdc_known_hosts_file }}'
# Same shape as the repository inventory.yml; the lab inventory is generated by lab/manage.
ssh:
  permitrootlogin: "no"
  passwordauthentication: "no"
  maxauthtries: 3
  logingracetime: 30
  x11forwarding: "no"
  allowagentforwarding: "no"
  allowtcpforwarding: "no"
  clientaliveinterval: 300
  clientalivecountmax: 2
