all:
  vars:
    # Declared sshd policy, checked by `ccdcctl scan` against the EFFECTIVE `sshd -T` values
    # (Match blocks included). Names are exactly what `sshd -T` prints, in lowercase.
    # Exact match, except maxauthtries/logingracetime/clientalivecountmax (declared value
    # is a maximum) and clientaliveinterval (deviates only if 0). Override per group/host,
    # e.g. a scored host that must take passwords: ssh: {passwordauthentication: "yes"}.
    # Omit an option to leave it unchecked; omit `ssh` entirely and scan reports it.
    ssh:
      permitrootlogin: "no"
      passwordauthentication: "no"
      maxauthtries: 3
      logingracetime: 30
      x11forwarding: "no"
      allowagentforwarding: "no"
      allowtcpforwarding: "no"
      clientaliveinterval: 300
      clientalivecountmax: 2
  hosts:
    # `ccdcctl services` records each host's approved services here, e.g.
    #   services:
    #     - {port: 22, proto: tcp, name: sshd}
    hatchery:
      ansible_host: 127.0.0.1
      ansible_port: 22270
    tarpit:
      ansible_host: 127.0.0.1
      ansible_port: 22170
