---
- name: Apply verified SSH policy one host at a time
  hosts: all
  gather_facts: false
  become: true
  serial: 1
  ignore_unreachable: true
  tasks:
    # A failed one-host serial batch otherwise stops later batches. Rescue now,
    # then fail the affected hosts in the final (nonserial) reporting play.
    - name: Isolate each host's SSH change
      block:
        - name: Apply SSH role
          ansible.builtin.include_role:
            name: ssh
      rescue:
        - name: Remember the failed host without stopping subsequent batches
          ansible.builtin.set_fact:
            ccdc_ssh_failure: "{{ ansible_failed_result.stderr | default(ansible_failed_result.msg | default('SSH policy application failed'), true) | trim }}"
        - name: Report the host failure immediately
          ansible.builtin.debug:
            msg: "SSH FAILED: {{ ccdc_ssh_failure }}"

- name: Report failed SSH hosts after all attempts
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Return a failed result for hosts whose SSH policy was not applied
      ansible.builtin.assert:
        that: ccdc_ssh_failure is not defined
        fail_msg: "{{ ccdc_ssh_failure | default('SSH policy application failed') }}"
        quiet: true
